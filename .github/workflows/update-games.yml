name: Atualizar lista de jogos

on:
  schedule:
    - cron: '0 6 * * 1'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: update-games
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Buscar jogos na Steam
        run: node scripts/update.mjs
      - name: Regenerar páginas e guias
        run: node scripts/build-pages.mjs
      - name: Salvar se mudou
        run: |
          git config user.name "rola-e-joga-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data/games.json guias sobre.html privacidade.html sitemap.xml robots.txt ads.txt
          git diff --cached --quiet || (git commit -m "Atualiza lista de jogos e guias" && git push)
