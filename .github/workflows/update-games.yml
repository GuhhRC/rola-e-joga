name: Atualizar lista de jogos

on:
  schedule:
    - cron: '0 6 * * *' # 06:00 UTC = 03:00 em Brasília
    - cron: '0 18 * * *' # 18:00 UTC = 15:00 em Brasília
  workflow_dispatch: # botão "Run workflow" para rodar na hora
    inputs:
      modo:
        description: 'completo = busca normal. descoberta = força procurar jogos novos em todos os gêneros agora (~25 min a mais). teste-rapido = só testa o salvamento (segundos)'
        type: choice
        default: completo
        options: [completo, descoberta, teste-rapido]

permissions:
  contents: write

concurrency:
  group: update-games
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Buscar jogos na Steam
        env:
          # filtros mais folgados: entram jogos com 200+ avaliações (antes 500) e até 1000 por gênero (antes 600)
          MIN_REVIEWS: '200'
          PER_GENRE: '1000'
        run: |
          if [ "${{ inputs.modo }}" = "teste-rapido" ]; then node scripts/update.mjs --seed-only
          elif [ "${{ inputs.modo }}" = "descoberta" ]; then node scripts/update.mjs --discover
          else node scripts/update.mjs; fi
      - name: Regenerar páginas e guias
        run: node scripts/build-pages.mjs
      - name: Guardar cópia dos dados (segurança)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: dados-jogos
          path: data
          retention-days: 7
      - name: Salvar se mudou
        if: always() # salva o que foi buscado mesmo se algum passo anterior falhar
        run: |
          git config user.name "rola-e-joga-bot"
          git config user.email "actions@users.noreply.github.com"
          for f in data guias sobre.html privacidade.html sitemap.xml robots.txt ads.txt; do
            [ -e "$f" ] && git add -A "$f"
          done
          git status --short | head -20
          if git diff --cached --quiet; then echo "nada mudou"; else
            git commit -m "Atualiza lista de jogos e guias"
            # se alguém (você) enviou arquivos enquanto o robô rodava, o GitHub recusa o envio; então puxa as novidades e tenta de novo
            ok=0
            for i in 1 2 3; do
              if git push; then ok=1; break; fi
              echo "envio recusado (tentativa $i); integrando mudanças novas e tentando de novo"
              git pull --rebase -X theirs || { git rebase --abort 2>/dev/null; sleep 5; }
            done
            [ "$ok" = 1 ] || { echo "ERRO AO ENVIAR: confira Settings > Actions > General > Workflow permissions = Read and write"; exit 1; }
          fi
